<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Propuesta interactiva de web y CRM para Isolabella Art Studio, por Agallart Digital."><title>Isolabella · Un espacio para crear</title>
<style>
:root{--cream:#f6f3eb;--ink:#303a32;--green:#536448;--clay:#bb795a;--lilac:#ded8e6;--line:#d9d9cd}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font:16px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}header{max-width:1320px;margin:auto;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:18px}.brand{font:italic 32px Georgia,serif;text-decoration:none;letter-spacing:-1px}.brand small{display:block;font:10px system-ui;letter-spacing:4px;text-transform:uppercase}nav{display:flex;gap:18px;align-items:center}nav a{text-decoration:none;font-size:13px}button,.btn{border:1px solid var(--green);background:var(--green);color:white;border-radius:40px;padding:11px 21px;text-decoration:none;display:inline-block;font-size:13px;font-weight:650}.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.demo-bar{background:var(--lilac);text-align:center;font-size:11px;padding:7px 12px;letter-spacing:.025em}.hero{max-width:1320px;margin:auto;display:grid;grid-template-columns:1.1fr 1fr;gap:7%;padding:64px 5% 60px;align-items:center}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700}.hero h1{font:clamp(48px,6vw,84px)/1.04 Georgia,serif;letter-spacing:-3px;margin:22px 0}.hero h1 em{font-weight:400;color:var(--clay)}.hero p{max-width:430px;color:#60695e;font-size:15px;margin-bottom:26px}.art{position:relative;min-height:430px;background:#dedbcf;border-radius:200px 200px 12px 12px;overflow:hidden;display:flex;align-items:end;justify-content:center}.sun{position:absolute;background:#f0dcc3;width:180px;height:180px;border-radius:50%;right:25px;top:35px}.shelf{position:absolute;bottom:80px;width:100%;height:10px;background:#a78b73;box-shadow:0 12px 40px #5e442c33}.pot{width:140px;height:190px;border-radius:22% 22% 45% 45%;background:linear-gradient(90deg,#97624d,#cd9371 45%,#ac7356);box-shadow:inset 6px 0 20px #e9c7a93b,12px 12px 30px #4c453633;position:relative;bottom:90px;transform:rotate(-6deg)}.pot:before{content:'';position:absolute;top:-8px;left:1%;width:98%;height:25px;background:#73503e;border:8px solid #c38c6b;border-radius:50%}.pot.two{width:100px;height:130px;margin-left:25px;transform:rotate(8deg);background:linear-gradient(90deg,#9d9e86,#bfc1a5,#999d80)}.pot.two:before{border-color:#b5b79b;background:#757961}.art-caption{position:absolute;bottom:20px;left:25px;font:italic 14px Georgia}.section{max-width:1320px;margin:auto;padding:45px 5%}h2{font:38px/1.15 Georgia,serif;margin:10px 0 20px;letter-spacing:-1px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.section-title p{max-width:350px;font-size:13px;color:#626a60}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fffcf7;border:1px solid var(--line);border-radius:12px;padding:24px}.card-icon{height:115px;border-radius:8px;display:grid;place-items:center;background:#e4e5d9;font:italic 52px Georgia;color:var(--green);margin-bottom:22px}.card:nth-child(2) .card-icon{background:#e6d8cd;color:#9d6145}.card:nth-child(3) .card-icon{background:var(--lilac);color:#73617f}.card h3{font:25px Georgia;margin:8px 0}.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase}.card p{font-size:13px;color:#687060}.card .meta{border-top:1px solid var(--line);padding:12px 0;font-size:12px;display:flex;justify-content:space-between}.card button{width:100%}.flow{background:#e8eadd;border-radius:14px;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.flow p{font-size:14px}.flow ul{font-size:14px;line-height:2}.crm{background:#eceee7;border-top:1px solid var(--line);padding-bottom:45px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:var(--green);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fffefa;border-radius:10px;padding:18px;border:1px solid var(--line)}.stat strong{display:block;font:32px Georgia}.stat span{font-size:11px;color:#626a60}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.tools input{flex:1;min-width:180px}.tools select{width:auto}input,select{border:1px solid #bfc6b5;border-radius:7px;padding:10px;background:#fffefa;color:var(--ink);width:100%;font-size:13px}label{font-size:12px;font-weight:650;display:block;margin:14px 0 5px}.table-wrap{overflow:auto;background:#fffefa;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:15px 13px;border-bottom:1px solid #e8e9e1}th{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#636e5d;background:#f8f9f2}td button{padding:6px 10px;font-size:10px;margin:2px}.pill{display:inline-block;padding:3px 9px;border-radius:15px;background:#edf0e6;font-size:10px}.pill.wait{background:#f4e6d4}.pill.pending{background:#ebe3f1}.muted{color:#6c7566;font-size:12px}.capacity{display:grid;gap:14px}.capacity .card{padding:18px}.bar{height:8px;background:#e2e5d9;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{height:100%;display:block;background:var(--green)}footer{max-width:1200px;margin:auto;padding:35px 5%;font-size:12px;display:flex;justify-content:space-between;gap:20px}dialog{border:1px solid var(--line);border-radius:16px;max-width:480px;width:calc(100% - 32px);padding:28px;background:var(--cream);color:var(--ink)}dialog::backdrop{background:#25302580}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:28px;margin:0}.close{background:none;border:0;color:var(--ink);padding:6px;font-size:22px}.submit{width:100%;margin-top:22px}.notice{font-size:12px;padding:12px 15px;background:#e4e0eb;border-radius:7px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:15px 22px;max-width:90%;z-index:5;font-size:13px}html{scroll-behavior:smooth}[hidden]{display:none!important}:focus-visible{outline:3px solid #ac754c;outline-offset:3px}@media(max-width:760px){header{flex-wrap:wrap}nav{gap:10px}.hero{grid-template-columns:1fr;padding-top:35px}.hero h1{letter-spacing:-2px}.art{min-height:300px;margin-top:10px}.cards{grid-template-columns:1fr}.card-icon{height:80px}.section-title{display:block}.flow{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.section{padding:30px 5%}h2{font-size:31px}.hero p{max-width:none}nav a{font-size:11px}footer{display:block}}
</style></head><body>
<div class="demo-bar" data-es="Propuesta de Agallart Digital · Demo interactiva · Actividades, fechas y precios de ejemplo" data-en="Proposal by Agallart Digital · Interactive demo · Illustrative activities, dates and prices"></div>
<header><a class="brand" href="#">isolabella<small>Art Studio · Valencia</small></a><nav><a href="#talleres" data-es="Talleres" data-en="Workshops"></a><a href="#estudio" data-es="El estudio" data-en="The studio"></a><a href="#crm" data-es="Probar CRM" data-en="Try CRM"></a><button id="lang" class="ghost" aria-label="Change language">EN</button></nav></header>
<main><section class="hero"><div><div class="eyebrow" data-es="Barro, tiempo y buena compañía" data-en="Clay, time and good company"></div><h1 data-es="Un espacio<br>para <em>crear.</em>" data-en="A space<br>to <em>create.</em>"></h1><p data-es="Clases de torno y modelado, talleres para desconectar y un espacio compartido donde dar forma a tus ideas." data-en="Wheel throwing, hand-building workshops and a shared studio to give your ideas a shape."></p><a class="btn" href="#talleres" data-es="Encuentra tu taller ↗" data-en="Find your workshop ↗"></a><p class="muted" data-es="Prueba el recorrido: solicita una plaza y encuéntrala en el panel del estudio." data-en="Try the journey: request a place and find it in the studio dashboard."></p></div><div class="art" role="img" aria-label="Ilustración de dos piezas de cerámica sobre una balda"><span class="sun"></span><span class="shelf"></span><div class="pot"></div><div class="pot two"></div><span class="art-caption">hecho despacio, hecho a mano.</span></div></section>
<section id="talleres" class="section"><div class="section-title"><div><div class="eyebrow" data-es="Encuentra tu momento" data-en="Find your moment"></div><h2 data-es="Manos en el barro." data-en="Get your hands into clay."></h2></div><p data-es="Programación ilustrativa. El estudio confirma cada solicitud; enviar el formulario no garantiza una plaza." data-en="Illustrative programme. The studio confirms each request; submitting a form does not guarantee a place."></p></div><div id="workshops" class="cards"></div></section>
<section id="estudio" class="section"><div class="flow"><div><div class="eyebrow">Isolabella Art Studio</div><h2 data-es="Tu próxima idea<br>necesita un lugar." data-en="Your next idea<br>needs a place."></h2><p data-es="Un recorrido pensado para combinar clases semanales, talleres puntuales y consultas de coworking en una misma web." data-en="A journey designed to bring weekly classes, one-off workshops and coworking enquiries together."></p><button id="cowork" data-es="Consultar coworking" data-en="Ask about coworking"></button></div><div><h3 data-es="De la consulta a la reserva" data-en="From enquiry to booking"></h3><ul><li data-es="Elige actividad, fecha y participantes." data-en="Choose an activity, date and participants."></li><li data-es="El estudio revisa las plazas disponibles." data-en="The studio checks available places."></li><li data-es="Confirma la reserva o gestiona la lista de espera." data-en="Confirm the booking or manage the waiting list."></li><li data-es="Registra señales y pagos pendientes en el CRM." data-en="Record deposits and outstanding payments in the CRM."></li></ul><p class="notice" data-es="Esta demo guarda cambios solo en este navegador. No envía mensajes, no cobra y no crea reservas reales. Usa únicamente datos ficticios." data-en="This demo stores changes in this browser only. It sends no messages, takes no payments and creates no real bookings. Use fictional data only."></p></div></div></section>
<section class="crm" id="crm"><div class="section"><div class="section-title"><div><div class="eyebrow" data-es="Vista de gestión · Demo sin autenticación" data-en="Management view · Demo without authentication"></div><h2 data-es="El estudio, en orden." data-en="Your studio, organised."></h2></div><button class="ghost" id="reset" data-es="Restablecer ejemplos" data-en="Reset examples"></button></div><div id="stats" class="stats"></div><div class="tools"><input id="search" aria-label="Buscar solicitudes" placeholder="Buscar / Search"><select id="status" aria-label="Filtrar por estado"><option value="all">Todos / All</option><option value="pending">Pendientes / Pending</option><option value="confirmed">Confirmadas / Confirmed</option><option value="wait">Lista de espera / Waiting</option><option value="cancelled">Canceladas / Cancelled</option></select><button id="new" data-es="+ Nueva solicitud" data-en="+ New enquiry"></button></div><div class="tabs"><button class="ghost active" data-tab="requests" data-es="Solicitudes" data-en="Enquiries"></button><button class="ghost" data-tab="capacity" data-es="Plazas y calendario" data-en="Capacity and schedule"></button></div><br><div id="requests" class="table-wrap"></div><div id="capacity" class="capacity" hidden></div><p class="muted" data-es="Las confirmaciones respetan el aforo. Las cancelaciones liberan plazas. Los pagos son apuntes simulados y no se procesan cobros." data-en="Confirmations respect capacity. Cancellations release places. Payment entries are simulated; no charges are processed."></p></div></section></main>
<footer><span>Isolabella · Propuesta visual y funcional, no web oficial.</span><span>Web + CRM a medida · Agallart Digital</span></footer>
<dialog id="booking"><form id="form"><div class="modal-head"><h2 data-es="Una nueva experiencia" data-en="A new experience"></h2><button type="button" class="close" id="close" aria-label="Cerrar">×</button></div><p class="muted" data-es="Solicitud de prueba. Introduce datos ficticios." data-en="Test enquiry. Enter fictional details."></p><label for="activity" data-es="Actividad" data-en="Activity"></label><select id="activity" required></select><label for="name" data-es="Nombre de ejemplo" data-en="Example name"></label><input id="name" required maxlength="70" value="Visitante demo"><label for="email" data-es="Email ficticio" data-en="Fictional email"></label><input id="email" type="email" required maxlength="120" value="visitante@example.test"><label for="people" data-es="Participantes" data-en="Participants"></label><input id="people" type="number" min="1" max="8" value="1" required><label for="language" data-es="Idioma de atención" data-en="Preferred language"></label><select id="language"><option>Español</option><option>English</option></select><button class="submit" data-es="Registrar solicitud de prueba" data-en="Create test enquiry"></button></form></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='isolabella-demo-v1';let lang='es',tab='requests';
const activities=[{id:'wheel',es:'Primeros pasos al torno',en:'Your first time at the wheel',date:'2026-11-14',time:'11:00–13:00',teacher:'Profesor/a demo A',capacity:6,price:48,mark:'01',kind:'Taller / Workshop'},{id:'hand',es:'Modelado: tu primera taza',en:'Hand-build your first cup',date:'2026-11-21',time:'17:00–19:00',teacher:'Profesor/a demo B',capacity:8,price:38,mark:'02',kind:'Taller / Workshop'},{id:'weekly',es:'Clase semanal de cerámica',en:'Weekly ceramics class',date:'2026-11-24',time:'18:00–20:00',teacher:'Profesor/a demo A',capacity:4,price:32,mark:'03',kind:'Sesión de ejemplo / Sample session'},{id:'cowork',es:'Consulta de coworking',en:'Coworking enquiry',date:'A convenir / To arrange',time:'—',teacher:'Equipo del estudio',capacity:null,price:0}];
const seed=()=>[{id:'D-001',activity:'wheel',name:'Participante demo 1',email:'demo1@example.test',people:2,language:'Español',status:'confirmed',paid:30},{id:'D-002',activity:'hand',name:'Participante demo 2',email:'demo2@example.test',people:1,language:'English',status:'pending',paid:0},{id:'D-003',activity:'weekly',name:'Participante demo 3',email:'demo3@example.test',people:4,language:'Español',status:'confirmed',paid:64},{id:'D-004',activity:'weekly',name:'Participante demo 4',email:'demo4@example.test',people:1,language:'Español',status:'wait',paid:0},{id:'D-005',activity:'cowork',name:'Consulta demo 5',email:'demo5@example.test',people:1,language:'English',status:'pending',paid:0}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(es,en)=>lang==='es'?es:en,act=id=>activities.find(a=>a.id===id),money=n=>new Intl.NumberFormat(lang==='es'?'es-ES':'en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
let rows=seed();try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.every(r=>r&&act(r.activity)&&['pending','confirmed','wait','cancelled'].includes(r.status)&&Number.isInteger(r.people)&&r.people>0&&r.people<=8&&Number.isFinite(r.paid)&&r.paid>=0&&typeof r.name==='string'&&typeof r.email==='string'))rows=saved;}catch{}
function seats(id,records=rows){const a=act(id);return a.capacity===null?null:a.capacity-records.filter(r=>r.activity===id&&r.status==='confirmed').reduce((s,r)=>s+r.people,0)}
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').hidden=true,6000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch{notify(t('El navegador no permite guardar; los cambios durarán esta sesión.','Storage unavailable; changes last for this session.'))}render()}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-es]').forEach(el=>{if(el.tagName==='H1'||el.tagName==='H2')el.innerHTML=el.dataset[lang];else el.textContent=el.dataset[lang]});$('lang').textContent=lang==='es'?'EN':'ES'}
function date(a){return a.id==='cowork'?t('A convenir','To arrange'):new Intl.DateTimeFormat(lang==='es'?'es-ES':'en-GB',{day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(a.date+'T12:00:00Z'))}
const labels=()=>({pending:t('Pendiente','Pending'),confirmed:t('Confirmada','Confirmed'),wait:t('Lista de espera','Waiting list'),cancelled:t('Cancelada','Cancelled')});
function render(){translate();$('workshops').innerHTML=activities.filter(a=>a.id!=='cowork').map(a=>`<article class="card"><div class="card-icon">${a.mark}</div><span class="tag">${a.kind}</span><h3>${esc(a[lang])}</h3><p>${date(a)} · ${a.time}<br>${esc(a.teacher)} · ${t('Contenido y docente ilustrativos','Illustrative content and tutor')}</p><div class="meta"><span>${seats(a.id)>0?t(seats(a.id)+' plazas disponibles',seats(a.id)+' places left'):t('Grupo completo','Group full')}</span><b>${money(a.price)} / ${t('persona','person')}</b></div><button data-book="${a.id}">${seats(a.id)>0?t('Solicitar plaza','Request a place'):t('Apuntarme a la lista','Join waiting list')}</button></article>`).join('');
const live=rows.filter(r=>r.status!=='cancelled'),pending=rows.filter(r=>r.status==='pending').length,confirmed=rows.filter(r=>r.status==='confirmed').reduce((s,r)=>s+r.people,0),waiting=rows.filter(r=>r.status==='wait').reduce((s,r)=>s+r.people,0),due=rows.filter(r=>r.status==='confirmed').reduce((s,r)=>s+Math.max(0,act(r.activity).price*r.people-r.paid),0);
$('stats').innerHTML=[[pending,t('Solicitudes pendientes','Pending enquiries')],[confirmed,t('Plazas confirmadas','Confirmed places')],[waiting,t('Personas en espera','People waiting')],[money(due),t('Pendiente de pago · simulado','Outstanding · simulated')]].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('');
const q=$('search').value.toLowerCase(),status=$('status').value,filtered=rows.filter(r=>(status==='all'||r.status===status)&&[r.name,r.email,act(r.activity)[lang],r.id].join(' ').toLowerCase().includes(q));
$('requests').innerHTML=`<table><thead><tr>${[t('Solicitud','Enquiry'),t('Actividad y horario','Activity and time'),t('Plazas','Places'),t('Estado','Status'),t('Pagado / total','Paid / total'),t('Acciones de prueba','Demo actions')].map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${filtered.map(r=>{const a=act(r.activity);return `<tr><td><b>${esc(r.name)}</b><br>${esc(r.email)}<br><span class="muted">${esc(r.id)} · ${esc(r.language)}</span></td><td>${esc(a[lang])}<br><span class="muted">${date(a)} · ${a.time}</span></td><td>${r.people}</td><td><span class="pill ${r.status}">${labels()[r.status]}</span></td><td>${a.id==='cowork'?t('Por presupuestar','Quote needed'):money(r.paid)+' / '+money(a.price*r.people)}</td><td>${r.status!=='confirmed'&&r.status!=='cancelled'?`<button data-action="confirm" data-id="${esc(r.id)}">${t('Confirmar','Confirm')}</button>`:''}${r.status==='pending'?`<button class="ghost" data-action="wait" data-id="${esc(r.id)}">${t('A espera','Waitlist')}</button>`:''}${r.status==='confirmed'&&a.price>0&&r.paid<a.price*r.people?`<button class="ghost" data-action="deposit" data-id="${esc(r.id)}">${t('+ Señal simulada','+ Simulate deposit')}</button><button class="ghost" data-action="paid" data-id="${esc(r.id)}">${t('Saldar simulado','Simulate paid')}</button>`:''}${r.status!=='cancelled'?`<button class="ghost" data-action="cancel" data-id="${esc(r.id)}">${t('Cancelar','Cancel')}</button>`:''}</td></tr>`}).join('')||`<tr><td colspan="6">${t('No hay solicitudes con esos filtros.','No enquiries match these filters.')}</td></tr>`}</tbody></table>`;
$('capacity').innerHTML=activities.filter(a=>a.capacity!==null).map(a=>`<article class="card"><b>${esc(a[lang])}</b> · ${date(a)} · ${a.time}<p class="muted">${esc(a.teacher)}</p><div class="bar"><i style="width:${(a.capacity-seats(a.id))/a.capacity*100}%"></i></div><span class="muted">${a.capacity-seats(a.id)} / ${a.capacity} ${t('plazas confirmadas','confirmed places')} · ${rows.filter(r=>r.activity===a.id&&r.status==='wait').reduce((s,r)=>s+r.people,0)} ${t('en espera','waiting')}</span></article>`).join('');
$('requests').hidden=tab!=='requests';$('capacity').hidden=tab!=='capacity';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function openForm(id){$('form').reset();$('activity').innerHTML=activities.map(a=>`<option value="${a.id}">${esc(a[lang])} · ${date(a)} ${a.time}</option>`).join('');$('activity').value=id||'wheel';$('booking').showModal();$('name').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.book)openForm(b.dataset.book);if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.action){const r=rows.find(r=>r.id===b.dataset.id);if(!r)return;const a=act(r.activity);switch(b.dataset.action){case'confirm':if(a.capacity!==null&&seats(a.id)<r.people){notify(t('No hay plazas suficientes. Mantén la solicitud en espera.','Not enough places. Keep this enquiry on the waiting list.'));return}r.status='confirmed';break;case'wait':r.status='wait';break;case'cancel':r.status='cancelled';break;case'deposit':r.paid=Math.min(a.price*r.people,r.paid+20);break;case'paid':r.paid=a.price*r.people;break}save();notify(t('Cambio de prueba guardado.','Demo change saved.'))}});
$('form').addEventListener('submit',e=>{e.preventDefault();if(!$('form').reportValidity())return;const a=act($('activity').value),people=Number($('people').value);if(!Number.isInteger(people)||people<1||people>8)return;const status=a.capacity!==null&&seats(a.id)<people?'wait':'pending';rows.unshift({id:'D-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),activity:a.id,name:$('name').value.trim()||t('Visitante demo','Demo visitor'),email:$('email').value.trim(),people,language:$('language').value,status,paid:0});$('booking').close();$('search').value='';$('status').value='all';tab='requests';save();notify(status==='wait'?t('Solicitud de prueba en lista de espera.','Demo enquiry added to waiting list.'):t('Solicitud registrada. Revisa el panel del estudio.','Enquiry added. Check the studio dashboard.'));document.getElementById('crm').scrollIntoView({behavior:'smooth'})});
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';render()};$('close').onclick=()=>$('booking').close();$('new').onclick=()=>openForm();$('cowork').onclick=()=>openForm('cowork');$('search').oninput=render;$('status').onchange=render;$('reset').onclick=()=>{rows=seed();$('search').value='';$('status').value='all';save();notify(t('Datos de ejemplo restablecidos.','Sample data restored.'))};render();
</script></body></html>
